<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checklist Funilaria">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7A1630">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Checklist Funilaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#BE1E48;--brand-l:#FBEDF0;--brand-d:#9E1B3B;--hdr:#7A1630;--or:#E8630A;--or-l:#FFF3EB;--ink:#111;--ink2:#3D3730;--ink3:#676160;--rule:#E8E2DC;--bg:#F8F5F5;--wh:#fff;--gr:#1A7A3C;--gr-l:#E8F5EE;--rd:#C0281E;--rd-l:#FCECEA;--am:#7C5000;--am-l:#FFF7E0;--pu:#5B21B6;--pu-l:#EDE9FE;--bl:#1565C0;--bl-l:#E8F4FD;--sh:0 1px 5px rgba(0,0,0,.09)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;position:fixed;inset:0;overflow:hidden;overflow:clip;overscroll-behavior:none}
.topbar{background:var(--hdr);padding:14px 16px 10px;flex-shrink:0}
.tb1{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-size:18px;color:#fff;font-weight:700;flex-shrink:0;border:none}
.bn{font-family:'Sora',sans-serif;font-size:16px;color:#fff;font-weight:700}
.bs{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.ptag{font-family:'DM Mono',monospace;font-size:14px;background:rgba(255,255,255,.2);color:#fff;padding:7px 12px;border-radius:8px;letter-spacing:.1em;font-weight:700;min-width:68px;text-align:center;border:1.5px solid rgba(255,255,255,.4)}
.pb-wrap{height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.pb-fill{height:100%;background:#fff;border-radius:2px;transition:width .3s}
.tb3{display:flex;justify-content:space-between;margin-top:7px}
.tbs{font-size:12px;color:rgba(255,255,255,.9);font-family:'DM Mono',monospace;letter-spacing:.05em;text-transform:uppercase;font-weight:500}
.tbp{font-size:12px;color:#fff;font-family:'DM Mono',monospace;font-weight:600}
.scroll-area{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pg{padding:16px 16px 20px}
.bnav{background:#fff;border-top:1px solid var(--rule);padding:12px 16px max(20px,env(safe-area-inset-bottom));display:flex;gap:10px;box-shadow:0 -2px 14px rgba(0,0,0,.07);flex-shrink:0}
.bnav.hidden{display:none}
.offline-bar{background:var(--rd);color:#fff;font-size:13px;font-weight:600;text-align:center;padding:9px 16px;display:none;flex-shrink:0}
.offline-bar.show{display:block}
.nb{flex:1;padding:16px;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;-webkit-user-select:none;user-select:none}
.nb:active{opacity:.75}
.nb-bk{background:var(--bg);color:var(--ink2);border:1.5px solid var(--rule)}
.nb-nx{background:var(--brand);color:#fff}
.nb-sd{background:var(--gr);color:#fff}
.home-wrap{padding:8px 0}
.home-title{font-family:'Sora',sans-serif;font-size:22px;font-weight:700;color:var(--ink);margin-bottom:6px}
.home-sub{font-size:15px;color:var(--ink3);margin-bottom:24px;line-height:1.5}
.home-btn{display:flex;align-items:center;gap:14px;background:var(--wh);border:1.5px solid var(--rule);border-radius:14px;padding:18px 20px;margin-bottom:12px;cursor:pointer;width:100%;text-align:left}
.home-btn:active{background:var(--brand-l)}
.home-btn-ico{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.home-btn.new .home-btn-ico{background:var(--brand-l)}
.home-btn.hist .home-btn-ico{background:#EFEDEE}
.home-btn-title{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:2px}
.home-btn-sub{font-size:13px;color:var(--ink3)}
.card{background:var(--wh);border-radius:12px;box-shadow:var(--sh);margin-bottom:14px;padding:18px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}
label{display:block;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
input[type=text],input[type=date]{width:100%;background:var(--bg);border:1.5px solid var(--rule);border-radius:9px;padding:14px;font-size:17px;font-family:'DM Sans',sans-serif;color:var(--ink);-webkit-appearance:none;transition:border-color .15s}
input:focus{outline:none;border-color:var(--brand);background:#fff}
.tec-select{width:100%;background:var(--bg);border:1.5px solid var(--rule);border-radius:9px;padding:14px;font-size:16px;font-family:'DM Sans',sans-serif;color:var(--ink);-webkit-appearance:none;appearance:none;outline:none;cursor:pointer}
.tec-select:focus{border-color:var(--brand);background:#fff}
.ip{font-family:'DM Mono',monospace !important;font-size:22px !important;font-weight:500 !important;letter-spacing:.15em !important;text-transform:uppercase !important}
.notice{background:var(--am-l);border:1px solid #D4A843;border-radius:10px;padding:14px 16px;font-size:15px;color:var(--am);line-height:1.6}
.shdr{display:flex;align-items:center;gap:10px;background:var(--brand-l);border-left:4px solid var(--brand);border-radius:10px;padding:13px 15px;margin-bottom:14px}
.shn{font-family:'DM Mono',monospace;font-size:12px;color:var(--brand);font-weight:500;white-space:nowrap}
.sht{font-family:'Sora',sans-serif;font-size:17px;font-weight:700;color:var(--ink);flex:1}
.shp{font-family:'DM Mono',monospace;font-size:13px;color:var(--ink3);white-space:nowrap}
.shdr-pend{background:var(--brand-l);color:var(--brand-d);font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:9px;margin:-4px 0 14px;display:none}
.shdr-pend.show{display:block}
.itm{background:var(--wh);border-radius:12px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden;border:2px solid transparent;transition:border-color .18s}
.itm.montado{border-color:var(--gr)}.itm.desmontado{border-color:var(--or)}
.destaque-banner{display:flex;align-items:center;gap:7px;background:var(--brand-d);color:#fff;font-size:12.5px;font-weight:700;padding:9px 15px;letter-spacing:.02em}
.destaque-banner .ic{font-size:15px;flex-shrink:0}
.itop{padding:15px 15px 11px;display:flex;align-items:flex-start;gap:10px}
.iref{font-family:'DM Mono',monospace;font-size:12px;color:var(--brand);font-weight:500;min-width:28px;padding-top:2px;flex-shrink:0}
.idesc{font-size:16px;font-weight:500;color:var(--ink);flex:1;line-height:1.5}
.idot{width:10px;height:10px;border-radius:50%;background:var(--rule);flex-shrink:0;margin-top:4px;transition:background .18s}
.idot.montado{background:var(--gr)}.idot.desmontado{background:var(--or)}
.sbr{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--bg)}
.sb{padding:16px 6px;border:none;background:var(--wh);cursor:pointer;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:5px;border-right:1px solid var(--bg);transition:background .15s,color .15s;-webkit-user-select:none;user-select:none;min-height:60px}
.sb:last-child{border-right:none}.sb:active{opacity:.7}
.sb .ic{font-size:24px;line-height:1}
.sb.mont{background:var(--gr-l);color:var(--gr)}.sb.desm{background:var(--or-l);color:var(--or)}
.xtr{display:none;padding:13px 15px;border-top:1px solid var(--bg);background:var(--bg)}
.xtr.open{display:block}
.rec-toggle{display:flex;align-items:center;gap:12px;background:var(--wh);border-radius:10px;padding:14px 16px;margin-bottom:12px;border:1.5px solid var(--rule);cursor:pointer;transition:border-color .15s}
.rec-toggle.on{border-color:var(--pu);background:var(--pu-l)}
.rec-icon{font-size:22px;flex-shrink:0}
.rec-text{flex:1}
.rec-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px}
.rec-sub{font-size:12px;color:var(--ink3)}
.rec-toggle.on .rec-title{color:var(--pu)}
.rec-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--rule);background:var(--wh);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.rec-toggle.on .rec-check{background:var(--pu);border-color:var(--pu);color:#fff}
.comp-toggle{display:flex;align-items:center;gap:12px;background:var(--wh);border-radius:12px;padding:16px;margin-bottom:14px;border:1.5px solid var(--rule);cursor:pointer;transition:border-color .15s;box-shadow:var(--sh)}
.comp-toggle.on{border-color:var(--bl);background:var(--bl-l)}
.comp-icon{font-size:24px;flex-shrink:0}
.comp-text{flex:1}
.comp-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px}
.comp-toggle.on .comp-title{color:var(--bl)}
.comp-sub{font-size:12px;color:var(--ink3)}
.comp-check{width:24px;height:24px;border-radius:6px;border:2px solid var(--rule);background:var(--wh);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s}
.comp-toggle.on .comp-check{background:var(--bl);border-color:var(--bl);color:#fff}
textarea{width:100%;background:#fff;border:1.5px solid var(--rule);border-radius:9px;padding:12px 14px;font-size:16px;font-family:'DM Sans',sans-serif;color:var(--ink);resize:none;transition:border-color .15s;margin-bottom:10px}
textarea:focus{outline:none;border-color:var(--brand)}
.fotos-wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.foto-thumb-wrap{position:relative;flex-shrink:0}
.foto-thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;border:2px solid var(--gr);display:block}
.foto-del-btn{position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:var(--rd);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1}
.foto-add-btn{display:flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0}
.foto-add-btn:active{background:var(--brand-d)}
.foto-obrig{font-size:12px;color:var(--rd);font-weight:600;margin-top:4px;display:none}
.foto-obrig.show{display:block}
.foto-thumb.uploading{opacity:.5}
.foto-spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;animation:fotospin 1s linear infinite;pointer-events:none}
@keyframes fotospin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.foto-retry-btn{position:absolute;inset:0;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;line-height:1.2;font-family:'DM Sans',sans-serif}
input[type=file]{display:none}
.pc{background:var(--wh);border-radius:12px;box-shadow:var(--sh);padding:18px;margin-bottom:12px}
.pn{font-family:'DM Mono',monospace;font-size:12px;color:var(--brand);font-weight:500;margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.pd{font-size:16px;font-weight:500;color:var(--ink);margin-bottom:14px;line-height:1.55}
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sbox{background:#fff;border-radius:10px;padding:14px 4px;text-align:center;box-shadow:var(--sh)}
.snum{font-family:'Sora',sans-serif;font-size:26px;font-weight:700}
.slbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-top:3px;font-family:'DM Mono',monospace}
.snum.t{color:var(--ink)}.snum.mo{color:var(--gr)}.snum.de{color:var(--or)}.snum.re{color:var(--pu)}
.ib{background:#fff;border-radius:12px;box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
.ir{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bg)}
.ir:last-child{border-bottom:none}
.ik{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-family:'DM Mono',monospace}
.iv{font-size:16px;font-weight:600;color:var(--ink)}
.iv.pv{font-family:'DM Mono',monospace;font-size:20px;letter-spacing:.12em}
.res-sec{margin-bottom:16px}
.res-sec-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-family:'DM Mono',monospace;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.res-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.res-badge.mo{background:var(--gr-l);color:var(--gr)}.res-badge.de{background:var(--or-l);color:var(--or)}.res-badge.re{background:var(--pu-l);color:var(--pu)}
.res-item{background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px;box-shadow:var(--sh)}
.res-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.res-dot.mo{background:var(--gr)}.res-dot.de{background:var(--or)}.res-dot.re{background:var(--pu)}
.res-sec2{font-size:11px;color:var(--ink3);font-family:'DM Mono',monospace;margin-bottom:2px}
.res-desc{font-size:14px;font-weight:500;color:var(--ink)}
.wn{background:var(--am-l);border:1px solid #D4A843;border-radius:10px;padding:14px 16px;font-size:15px;color:var(--am);line-height:1.6;margin-bottom:12px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-size:15px;font-weight:600;cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;padding:0;margin-bottom:14px}
.hist-filters{margin-bottom:12px}
.hist-search-wrap{display:flex;align-items:center;background:var(--wh);border:1.5px solid var(--rule);border-radius:10px;padding:0 14px;margin-bottom:10px;box-shadow:var(--sh)}
.hist-search-icon{font-size:16px;margin-right:8px;flex-shrink:0}
.hist-search-input{flex:1;border:none;background:transparent;font-size:16px;font-family:'DM Sans',sans-serif;color:var(--ink);padding:13px 0;outline:none}
.hist-search-input::placeholder{color:var(--ink3)}
.hist-date-row{display:flex;gap:8px;align-items:flex-end}
.hist-date-group{flex:1}
.hist-date-group label{display:block;font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.hist-date-input{width:100%;background:var(--wh);border:1.5px solid var(--rule);border-radius:9px;padding:11px 10px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--ink);-webkit-appearance:none;outline:none}
.hist-date-input:focus{border-color:var(--brand)}
.hist-clear-btn{background:var(--rule);border:none;border-radius:9px;padding:11px 14px;font-size:14px;cursor:pointer;color:var(--ink3);flex-shrink:0;font-family:'DM Sans',sans-serif;font-weight:600}
.hist-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);margin-bottom:8px;letter-spacing:.04em}
.hist-stats{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.hist-stat{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;font-family:'DM Mono',monospace}
.hist-stat.de{background:var(--or-l);color:var(--or)}
.hist-stat.re{background:var(--pu-l);color:var(--pu)}
.hist-stat.ok{background:var(--gr-l);color:var(--gr)}
.hist-stat.comp{background:var(--bl-l);color:var(--bl)}
.hist-item{background:var(--wh);border-radius:12px;box-shadow:var(--sh);padding:13px 14px 13px 12px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;border-left:5px solid var(--gr)}
.hist-item.has-desm{border-left-color:var(--or)}
.hist-item:active{background:var(--bg)}
.hist-time{display:flex;align-items:center;justify-content:center;min-width:56px;padding-right:12px;border-right:1px solid var(--rule);align-self:stretch}
.hist-hora{font-family:'DM Mono',monospace;font-size:17px;font-weight:500;color:var(--ink);letter-spacing:.02em}
.hist-placa{display:inline-block;font-family:'DM Mono',monospace;font-size:17px;font-weight:500;color:var(--ink);letter-spacing:.1em;background:var(--bg);border:1.5px solid var(--rule);border-radius:7px;padding:2px 9px}
.hist-info{flex:1;min-width:0}
.hist-meta{font-size:13px;color:var(--ink3);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-day{position:sticky;top:-1px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);padding:10px 2px 8px;margin-top:4px;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.hist-day-n{background:var(--rule);color:var(--ink2);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;flex-shrink:0}
.hist-badge{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--gr-l);color:var(--gr);font-weight:600;font-family:'DM Mono',monospace;white-space:nowrap}
.hist-arrow{color:var(--ink3);font-size:18px}
.hist-empty{text-align:center;padding:40px 20px;color:var(--ink3);font-size:15px}
.det-section{background:var(--wh);border-radius:12px;box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.det-sec-hdr{background:var(--hdr);color:#fff;padding:10px 14px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.det-item{padding:11px 14px;border-bottom:1px solid var(--bg);display:flex;align-items:flex-start;gap:10px}
.det-item:last-child{border-bottom:none}
.det-ref{font-family:'DM Mono',monospace;font-size:11px;color:var(--brand);min-width:26px;flex-shrink:0;padding-top:2px}
.det-desc{font-size:14px;color:var(--ink);font-weight:500}
.det-status{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.det-status.montado{background:var(--gr-l);color:var(--gr)}
.det-status.desmontado{background:var(--or-l);color:var(--or)}
.det-status.empty{background:var(--rule);color:var(--ink3)}
.det-rec{font-size:11px;color:var(--pu);font-weight:600;margin-top:3px}
.det-obs{font-size:12px;color:var(--ink3);font-style:italic;margin-top:2px}
.det-foto-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--brand);font-weight:600;text-decoration:none;margin-top:4px;margin-right:8px}
.det-hero{display:flex;align-items:center;gap:12px;background:var(--wh);border-radius:14px;box-shadow:var(--sh);padding:16px 14px;margin-bottom:14px}
.plate{flex-shrink:0;background:#fff;border:3px solid #111;border-radius:9px;overflow:hidden;min-width:128px;text-align:center}
.plate-top{background:#1d4ea3;color:#fff;font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.28em;padding:2px 0 2px .28em}
.plate-num{font-family:'DM Mono',monospace;font-size:23px;font-weight:500;color:#111;letter-spacing:.08em;padding:5px 6px 4px 10px;line-height:1.1}
.det-hero-info{flex:1;min-width:0}
.dh-row{display:flex;align-items:flex-start;gap:6px;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:5px;flex-wrap:nowrap;line-height:1.3}
.dh-row:last-child{margin-bottom:0}
.dh-ic{font-size:14px;display:flex;align-items:center;height:1.3em;flex-shrink:0}
.dh-tx{min-width:0;overflow-wrap:anywhere}
.dh-row:nth-child(3){font-size:14px}
.dh-sep{color:var(--ink3);margin:0 2px}

};

// ── AUTH ─────────────────────────────────────────────────────────────────────
var _session = null;
var _tecnico = null; // { id, nome, email }
var _refreshTimer = null;

function getAuthHeaders() {
  var token = _session ? _session.access_token : SUPABASE_KEY;
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json'
  };
}

// Wrapper que renova o token automaticamente em caso de 401
async function sbFetch(url, options) {
  var res = await fetch(url, options);
  if ((res.status === 401 || res.status === 403) && _session && _session.refresh_token) {
    var nova = await tentarRenovarSessao(_session.refresh_token);
    if (nova) {
      _session = nova;
      localStorage.setItem('sb_session', JSON.stringify(_session));
      var newOpts = Object.assign({}, options, {
        headers: Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + _session.access_token })
      });
      res = await fetch(url, newOpts);
    } else {
      localStorage.removeItem('sb_session');
      _session = null; _tecnico = null;
      renderLogin();
      throw new Error('Sessão expirada. Faça login novamente.');
    }
  }
  return res;
}

function agendarRefreshToken() {
  if (_refreshTimer) clearInterval(_refreshTimer);
  _refreshTimer = setInterval(async function() {
    if (!_session || !_session.refresh_token) return;
    var nova = await tentarRenovarSessao(_session.refresh_token);
    if (nova) {
      _session = nova;
      localStorage.setItem('sb_session', JSON.stringify(_session));
    } else {
      clearInterval(_refreshTimer); _refreshTimer = null;

async function tentarRenovarSessao(refreshToken) {
  var res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },

  });
  if (!res.ok) return null;
  var data = await res.json();
  return { access_token: data.access_token, refresh_token: data.refresh_token };
}

async function iniciarSessao() {
  // 1. Verifica hash da URL (retorno do OAuth)
  var hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    var params = new URLSearchParams(hash.replace('#', ''));
    _session = {
      access_token:  params.get('access_token'),
      refresh_token: params.get('refresh_token')
    };
    localStorage.setItem('sb_session', JSON.stringify(_session));
    history.replaceState(null, '', window.location.pathname);
  }

  // 2. Tenta recuperar do localStorage
  if (!_session) {
    try { _session = JSON.parse(localStorage.getItem('sb_session')); } catch(e) { _session = null; }
  }

  if (!_session || !_session.access_token) { renderLogin(); return; }

  // 3. Valida o token atual
  var userRes = await fetch(SUPABASE_URL + '/auth/v1/user', {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + _session.access_token }
  });

  // 4. Se expirou, tenta renovar com refresh_token
  if (!userRes.ok && _session.refresh_token) {
    var nova = await tentarRenovarSessao(_session.refresh_token);
    if (nova) {
      _session = nova;
      localStorage.setItem('sb_session', JSON.stringify(_session));
      userRes = await fetch(SUPABASE_URL + '/auth/v1/user', {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + _session.access_token }
      });
    } else {
      localStorage.removeItem('sb_session');
      _session = null;
      renderLogin();
      return;
    }
  }

  if (!userRes.ok) { localStorage.removeItem('sb_session'); _session = null; renderLogin(); return; }

  var user  = await userRes.json();
  var email = (user.email || '').toLowerCase();

  // 5. Verifica se o e-mail está na tabela de técnicos
  var tecs = await fetch(API + '/tecnicos?select=id,nome,email&email=eq.' + encodeURIComponent(email), {
    headers: getAuthHeaders()
  }).then(function(r){ return r.json(); }).catch(function(){ return []; });

  if (!tecs || !tecs[0]) {
    // Não é técnico — verifica se é domínio Kovi para acesso como leitor
    if (email.endsWith('@kovi.com.br')) {
      iniciarSessaoLeitor(user);
      return;
    }
    localStorage.removeItem('sb_session');
    _session = null;
    renderLogin();
    setTimeout(function(){ document.getElementById('login-error').classList.add('show'); }, 100);
    return;
  }

  _tecnico = tecs[0];
  ST.td    = _tecnico.nome;
  _modo    = 'tecnico';
  mostrarApp();
}

async function iniciarSessaoLeitor(user) {
  // Qualquer @kovi.com.br que não é técnico entra como leitor
  var nome = (user.user_metadata && user.user_metadata.full_name) || user.email || 'Usuário';
  _tecnico = { id: null, nome: nome, email: user.email };
  _modo    = 'leitor';
  mostrarApp();
}

async function sbUpdate(table, id, body) {

    method: 'PATCH', headers: h, body: JSON.stringify(body)
  });
  if (!res.ok) { var e = await res.json().catch(function(){ return {}; }); throw new Error(e.message || res.statusText); }
  return res.json();
}

async function sbSelect(table, params) {
  var url = API + '/' + table + (params ? '?' + params : '');
  var res = await sbFetch(url, { headers: getAuthHeaders() });
  if (!res.ok) { var e = await res.json().catch(function(){ return {}; }); throw new Error(e.message || res.statusText); }
  return res.json();
}

async function sbSelectAll(table, params) {
  var PAG = 1000, off = 0, all = [];
  while (true) {
    var lote = await sbSelect(table, params + '&limit=' + PAG + '&offset=' + off);
    all = all.concat(lote);
    if (lote.length < PAG) break;
    off += PAG;
    if (off > 200000) break;
  }
  return all;
}

async function sbInsert(table, body) {
  var h = Object.assign({}, getAuthHeaders(), { 'Prefer': 'return=representation' });
  var res = await sbFetch(API + '/' + table, { method: 'POST', headers: h, body: JSON.stringify(body) });
  if (!res.ok) { var e = await res.json().catch(function(){ return {}; }); throw new Error(e.message || res.statusText); }
  var data = await res.json();
  return Array.isArray(data) ? data[0] : data;
}

// So as fotos ja enviadas (status 'done') viram {url, storagePath} no rascunho —
// leve o bastante pra sessionStorage, e garante que uma foto ja no R2 nunca se perde.
function fotosProntasSnap(fotos){
  return (fotos||[]).filter(function(f){ return f.status==='done'; }).map(function(f){ return {url:f.url, storagePath:f.storagePath}; });
}
function salvarRascunho() {
  if (ST.mode !== 'checklist') return;

    var snap = {
      step: ST.step, placa: ST.placa, data: ST.data,
      td: ST.td, complemento: ST.complemento, _editId: ST._editId || null,
      uploadId: ST.uploadId || null,
      pecas: (ST.pecas||[]).map(function(p){ return {o:p.o||'', fotos:fotosProntasSnap(p.fotos)}; }),
      chk: {}
    };
    CAT.forEach(function(it){
      var kk=ky(it), cc=ST.chk[kk];
      snap.chk[kk] = {st:cc.st, flag:cc.flag, o:cc.o||'', dbId:cc.dbId||null, fotos:fotosProntasSnap(cc.fotos)};
    });
    sessionStorage.setItem('cl_rascunho', JSON.stringify(snap));
  } catch(e){}
}

function limparRascunho() {
  try { sessionStorage.removeItem('cl_rascunho'); } catch(e){}
  try { sessionStorage.removeItem('cl_nav'); } catch(e){}
}

function restaurarRascunho() {
  try {
    var raw = sessionStorage.getItem('cl_rascunho');
    if (!raw) return false;
    var snap = JSON.parse(raw);
    ST.mode='checklist'; ST.step=snap.step||0;
    ST.placa=snap.placa||''; ST.data=snap.data||'';
    ST.td=snap.td||(_tecnico?_tecnico.nome:'');
    ST.complemento=snap.complemento||false;
    ST._editId=snap._editId||null;
    ST.uploadId=snap.uploadId||novoUploadId();
    CAT.forEach(function(it){
      var kk=ky(it), s=snap.chk&&snap.chk[kk];
      var fotos=((s&&s.fotos)||[]).map(function(f){ return {status:'done', url:f.url, storagePath:f.storagePath, localPreview:null}; });
      if(s){ ST.chk[kk]={st:s.st,flag:s.flag,o:s.o||'',fotos:fotos,dbId:s.dbId||null}; }
    });
    if(snap.pecas) snap.pecas.forEach(function(p,i){
      if(ST.pecas[i]){
        ST.pecas[i].o=p.o||'';
        ST.pecas[i].fotos=((p.fotos)||[]).map(function(f){ return {status:'done', url:f.url, storagePath:f.storagePath, localPreview:null}; });
      }
    });
    return true;
  } catch(e){ limparRascunho(); return false; }
}

// ── LINK DIRETO PARA UM CHECKLIST (#/checklist/<id>) ─────────────────────────
// O ID vai na URL (apos o #), entao qualquer registro pode ser enviado por link.
// Usa so o hash: funciona no GitHub Pages sem configuracao e nao colide com
// o #access_token do retorno do login.
var ROTA_PREFIXO = '#/checklist/';
var _detPushed = false;
function idDaRota(hash) {
  if (!hash || hash.indexOf(ROTA_PREFIXO) !== 0) return null;
  var id = '';
  try { id = decodeURIComponent(hash.slice(ROTA_PREFIXO.length)).trim(); } catch(e) { return null; }
  // So aceita formato de UUID: o valor entra no filtro da consulta ao banco
  return /^[0-9a-fA-F-]{8,64}$/.test(id) ? id : null;
}
function limparHashRota() {
  if (location.hash.indexOf(ROTA_PREFIXO) === 0) history.replaceState(null, '', location.pathname + location.search);
}
function garantirHashRota() {
  var alvo = ROTA_PREFIXO + ST.detId;
  if (location.hash !== alvo) {
    history.pushState(null, '', location.pathname + location.search + alvo);
    _detPushed = true;
  }
}
// Voltar dentro do app: se o detalhe foi aberto pela lista, volta no historico do
// navegador (mantem o botao Voltar do celular coerente); se veio de um link, so
// troca para a lista.
function voltarDoDetalhe() {
  if (_detPushed) { _detPushed = false; history.back(); }
  else { limparHashRota(); verHistorico(); }
}

window.addEventListener('popstate', function() {
  if (!_session || !_tecnico || ST.mode === 'checklist') return;
  _detPushed = false;
  var id = idDaRota(location.hash);
  if (id) {
    if (ST.detId !== id) ST.detPlaca = '-';
    ST.mode = 'det'; ST.detId = id; render();
  } else if (ST.mode === 'det') {
    ST.mode = 'hist'; render();
  }
});
function compartilharChecklist() {
  var url = location.origin + location.pathname + ROTA_PREFIXO + ST.detId;
  var titulo = 'Checklist ' + (ST.detPlaca && ST.detPlaca !== '-' ? ST.detPlaca : 'Funilaria');
  if (navigator.share) {
    navigator.share({ title: titulo, text: titulo, url: url }).catch(function(e) {
      if (!e || e.name !== 'AbortError') copiarLinkChecklist(url);
    });
    return;
  }
  copiarLinkChecklist(url);
}
function copiarLinkChecklist(url) {
  function ok() { mostrarModal('Link copiado! Cole na conversa para enviar este checklist.', '<svg class="svg-i" aria-hidden="true"><use href="#i-link"/></svg>'); }
  function fallback() {
    try {
      var ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); ok();
    } catch(e) { mostrarModal(url, '<svg class="svg-i" aria-hidden="true"><use href="#i-link"/></svg>'); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok).catch(fallback);
  else fallback();
}

function restaurarEstado() {
  // 0. Link direto para um checklist (na URL, ou guardado antes do login)
  var rotaId = idDaRota(location.hash);
  try {
    var pend = JSON.parse(localStorage.getItem('cl_pending_link') || 'null');
    localStorage.removeItem('cl_pending_link');
    if (!rotaId && pend && pend.h && (Date.now() - pend.t) < 15 * 60 * 1000) {
      rotaId = idDaRota(pend.h);
      if (rotaId) history.replaceState(null, '', location.pathname + location.search + ROTA_PREFIXO + rotaId);
    }
  } catch(e) {}
  if (rotaId) { ST.mode = 'det'; ST.detId = rotaId; ST.detPlaca = '-'; render(); return; }

  // 1. Rascunho de checklist em andamento
  try {
    var raw = sessionStorage.getItem('cl_rascunho');
    if (raw) {
      var snap = JSON.parse(raw);
      if (snap && snap.placa) {
        var restaurado = restaurarRascunho();
        render();
        if (restaurado) mostrarModal('Checklist restaurado! Seu progresso e as fotos já enviadas foram recuperados.','<svg class="svg-i i-ok" aria-hidden="true"><use href="#i-check-circle"/></svg>');
        return;
      }
    }
  } catch(e){}

  // 2. Estado de navegação (histórico / detalhe)
  try {
    var navRaw = sessionStorage.getItem('cl_nav');
    if (navRaw) {
      var nav = JSON.parse(navRaw);
      if (nav.mode==='hist') { ST.mode='hist'; }
      else if (nav.mode==='det' && nav.detId) { ST.mode='det'; ST.detId=nav.detId; ST.detPlaca=nav.detPlaca||'-'; }
    }
  } catch(e){}

  render();
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  salvarRascunho();
  salvarNavState();
  if (ST.mode === 'det') garantirHashRota(); else { limparHashRota(); _detPushed = false; }
  var p = document.getElementById('pg'); p.innerHTML = '';
  document.getElementById('sa').scrollTop = 0;
  if(ST.mode==='home'){ rHome(p); setNav(false); uiTop('INÍCIO','','-'); return; }
  if(ST.mode==='hist'){ rHistLoading(p); setNav(false); uiTop('HISTÓRICO','','-'); return; }
  if(ST.mode==='det') { rDetLoading(p);  setNav(false); return; }
  var s = STEPS[ST.step];
  if(s==='hdr')              rHdr(p);
  else if(SECS.indexOf(s)>=0) rSec(p,s);
  else if(s==='pecas')       rPecas(p);
  else                        rResumo(p);
  uiSync();
}
function uiTop(step,pct,placa){
  document.getElementById('tbs').textContent  = step;
  document.getElementById('tbp').textContent  = pct;
  document.getElementById('ptag').textContent = placa;
  document.getElementById('pf').style.width   = pct || '0%';
}
function setNav(show, isSend){
  var n = document.getElementById('bnav');
  if(!show){ n.classList.add('hidden'); return; }
  n.classList.remove('hidden');
  var nb = document.getElementById('bnx');
  if(isSend){ nb.className='nb nb-sd'; nb.textContent='Enviar checklist'; }
  else       { nb.className='nb nb-nx'; nb.textContent='Próximo'; }
  document.getElementById('bbk').style.display = '';
}
function uiSync(){
  var s   = STEPS[ST.step];
  var pct = Math.round(ndone()/CAT.length*100)+'%';
  var nm  = {hdr:'IDENTIFICAÇÃO',Frente:'FRENTE',Lateral:'LATERAL',Traseira:'TRASEIRA',Interna:'INTERNA',pecas:'PEÇAS REMOVIDAS',resumo:'RESUMO'};
  uiTop(nm[s]||s, pct+' concluido', (ST.placa||'-').toUpperCase());
  setNav(true, s==='resumo');
}

function rHistLoading(p){
  p.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
    +'<button class="back-link" style="margin-bottom:0" onclick="voltarHome()"><svg class="svg-i" aria-hidden="true"><use href="#i-chev-l"/></svg> Voltar</button>'
    +'<button onclick="verHistorico()" style="background:none;border:1.5px solid var(--rule);color:var(--ink3);font-size:13px;font-family:\'DM Sans\',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px"><svg class="svg-i" aria-hidden="true"><use href="#i-refresh"/></svg> Atualizar</button>'
  +'</div>'
  +'<div style="text-align:center;padding:30px;color:var(--ink3);font-size:15px">Carregando...</div>';

  (async function(){
    try {
      var cls = await sbSelectAll('checklists',
        'select=id,placa,data,tem_complemento,created_at,tecnicos(nome)&order=data.desc,created_at.desc,id.desc');

      if(!cls || cls.length===0){ rHistData(p,[]); return; }

      // Usa RPC para agregar stats sem limite de linhas
      var ids = cls.map(function(c){ return c.id; });
      var statsData = [];
      for (var i = 0; i < ids.length; i += 500) {
        var statsRes = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_checklist_stats', {
          method: 'POST',
          headers: Object.assign({}, getAuthHeaders(), {'Content-Type':'application/json'}),
          body: JSON.stringify({ ids: ids.slice(i, i + 500) })
        });
        if (statsRes.ok) statsData = statsData.concat(await statsRes.json());
      }

      var stats = {};
      (statsData || []).forEach(function(s){
        stats[s.checklist_id] = {
          desm:  parseInt(s.desm)  || 0,
          rec:   parseInt(s.rec)   || 0,
          total: parseInt(s.total) || 0
        };
      });

      var checklists = cls.map(function(c){
        return {
          ID: c.id,
          Placa: c.placa,
          Data: c.data ? c.data.split('-').reverse().join('/') : '',
          _iso: c.data || '',
          _hora: horaChecklist(c.created_at),
          Tecnico_Desmontagem: c.tecnicos ? c.tecnicos.nome : '',
          Status: 'Concluido',
          _complemento: c.tem_complemento,
          _desm:  (stats[c.id]||{}).desm  || 0,
          _rec:   (stats[c.id]||{}).rec   || 0,
          _total: (stats[c.id]||{}).total || 0
        };
      });

      rHistData(p, checklists);
    } catch(e) {
      p.innerHTML='<button class="back-link" onclick="voltarHome()"><svg class="svg-i" aria-hidden="true"><use href="#i-chev-l"/></svg> Voltar</button>'
        +'<div class="hist-empty">Erro ao carregar: '+e.message+'</div>';
    }
  })();
}

      +'<div class="hist-date-row"><div class="hist-date-group"><label>De</label><input class="hist-date-input" type="date" id="hist-de"></div><div class="hist-date-group"><label>Até</label><input class="hist-date-input" type="date" id="hist-ate"></div><button class="hist-clear-btn" onclick="limparFiltros()"><svg class="svg-i" aria-hidden="true"><use href="#i-x"/></svg></button></div>'

function toggleFiltroComplemento(){

function filtrarHist(){
  var s=document.getElementById('hist-search'),de=document.getElementById('hist-de'),ate=document.getElementById('hist-ate');
  if(!s) return;
  var q=s.value.toUpperCase().trim(),dv=de?de.value:'',av=ate?ate.value:'';
  var filtered=_allChecklists.filter(function(c){
    if(_filtroComplemento && !c._complemento) return false;
    var texto=((c.Placa||'')+' '+(c.Tecnico_Desmontagem||'')).toUpperCase();
    if(q&&texto.indexOf(q)<0) return false;
    if(dv||av){ var parts=(c.Data||'').split('/'); if(parts.length===3){ var iso=parts[2]+'-'+parts[1]+'-'+parts[0]; if(dv&&iso<dv) return false; if(av&&iso>av) return false; } }
    return true;
  });
  renderHistList(filtered);
}
function limparFiltros(){
  var s=document.getElementById('hist-search'); if(s) s.value='';
  var d=document.getElementById('hist-de'); if(d) d.value='';
  var a=document.getElementById('hist-ate'); if(a) a.value='';
  renderHistList(_allChecklists);
}
// Hora em que o checklist foi registrado (created_at), sempre no fuso de Sao Paulo,
// independente da configuracao do celular.
var _fmtHora = null;
try { _fmtHora = new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}); } catch(e) {}
function horaChecklist(ts){
  if(!ts) return '';
  var d=new Date(ts); if(isNaN(d.getTime())) return '';
  if(_fmtHora) return _fmtHora.format(d);
  var l=new Date(d.getTime()-3*60*60*1000);
  return ('0'+l.getUTCHours()).slice(-2)+':'+('0'+l.getUTCMinutes()).slice(-2);
}
var _DIAS_SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var _MESES_ANO=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function rotuloDia(iso){
  if(!iso) return 'Sem data';
  var hojeIso=new Date(Date.now()-3*60*60*1000).toISOString().slice(0,10);
  var ontemIso=new Date(Date.now()-27*60*60*1000).toISOString().slice(0,10);
  var p=iso.split('-'); if(p.length!==3) return iso;
  var dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  var base=_DIAS_SEM[dt.getUTCDay()]+', '+(+p[2])+' de '+_MESES_ANO[+p[1]-1];
  if(iso===hojeIso) return 'Hoje · '+base;
  if(iso===ontemIso) return 'Ontem · '+base;
  return base;
}
function renderHistList(list){
  var wrap=document.getElementById('hist-list'); if(!wrap) return;
  if(!list||list.length===0){ wrap.innerHTML='<div class="hist-empty">Nenhum resultado encontrado.</div>'; return; }
  var hojeIso=new Date(Date.now()-3*60*60*1000).toISOString().slice(0,10);
  var hoje=list.filter(function(e){ return e._iso===hojeIso; }).length;
  var html='<div class="hist-count">'+list.length+' checklist'+(list.length!==1?'s':'')+(hoje>0?' &middot; '+hoje+' hoje':'')+'</div>';
  // A lista ja vem ordenada por data (mais recente primeiro): agrupa dias consecutivos
  var grupos=[];
  list.forEach(function(entry){
    var g=grupos[grupos.length-1];
    if(!g||g.iso!==(entry._iso||'')){ g={iso:entry._iso||'',itens:[]}; grupos.push(g); }
    g.itens.push(entry);
  });
  grupos.forEach(function(g){
    html+='<div class="hist-day"><span>'+rotuloDia(g.iso)+'</span><span class="hist-day-n">'+g.itens.length+'</span></div>';
    g.itens.forEach(function(entry){
      var id=(entry.ID||'').replace(/'/g,''), placa=(entry.Placa||'-').replace(/'/g,'');
      var desm=entry._desm||0, rec=entry._rec||0, total=entry._total||0;
      html+='<div class="hist-item'+(desm>0?' has-desm':'')+'" onclick="verDetalhe(\''+id+'\',\''+placa+'\')">'
        +'<div class="hist-time"><span class="hist-hora">'+(entry._hora||'--:--')+'</span></div>'
        +'<div class="hist-info"><div class="hist-placa">'+placa+'</div><div class="hist-meta"><svg class="svg-i" aria-hidden="true"><use href="#i-user"/></svg> '+(entry.Tecnico_Desmontagem||'-')+'</div><div class="hist-stats">';
      if(desm>0)              html+='<span class="hist-stat de">'+desm+' desmontada'+(desm!==1?'s':'')+'</span>';
      if(rec>0)               html+='<span class="hist-stat re">'+rec+' recuperação</span>';
      if(desm===0&&total>0)   html+='<span class="hist-stat ok">Todas não desmontadas</span>';
      if(entry._complemento)  html+='<span class="hist-stat comp"><svg class="svg-i" aria-hidden="true"><use href="#i-wrench"/></svg> Complemento</span>';
      html+='</div></div><span class="hist-arrow"><svg class="svg-i" aria-hidden="true"><use href="#i-chev-r"/></svg></span></div>';
    });
  });
  wrap.innerHTML=html;
}

function abrirFoto(src){

  document.body.appendChild(o);
}
function driveId(u){
  var m=/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/.exec(u||'');
  return m?m[1]:null;
}
function driveFallback(img){
  var a=document.createElement('a');
  a.className='det-thumb det-thumb-link'; a.href=img.getAttribute('data-orig'); a.target='_blank'; a.rel='noopener';
  a.innerHTML='<svg class="svg-i" aria-hidden="true"><use href="#i-camera"/></svg><span>Abrir no Drive</span>';
  img.replaceWith(a);
}
function thumbsHtml(fotos){
  if(!fotos.length) return '';
  return '<div class="det-thumbs">'+fotos.map(function(u){
    u=u.trim(); var id=driveId(u);
    if(id){
      var base='https://drive.google.com/thumbnail?id='+id;
      return '<img class="det-thumb" loading="lazy" alt="Foto" src="'+base+'&sz=w320" data-full="'+base+'&sz=w1600" data-orig="'+u+'" onclick="abrirFoto(this.getAttribute(\'data-full\'))" onerror="driveFallback(this)">';
    }
    return '<img class="det-thumb" loading="lazy" alt="Foto" src="'+u+'" onclick="abrirFoto(this.src)">';
  }).join('')+'</div>';
}

function compress(file,cb){ var r=new FileReader(); r.onload=function(e){ var img=new Image(); img.onload=function(){ var M=720,w=img.width,h=img.height; if(w>M){h=h*M/w;w=M;} if(h>M){w=w*M/h;h=M;} var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); cb(cv.toDataURL('image/jpeg',.6)); }; img.src=e.target.result; }; r.readAsDataURL(file); }
// Envia a foto para o R2 assim que é tirada, em vez de esperar o fim do checklist —
// assim uma travada/recarregamento no resumo final nao obriga a refazer as fotos.
// Ponto de entrada publico: ignora chamadas repetidas enquanto ja existe um envio
// (ou uma retentativa agendada) em andamento pra este slot, pra nao disparar upload
// em duplicidade quando o botao "tentar novamente", a volta da conexao e a
// retentativa automatica coincidirem.
function enviarFotoSlot(slot, kk, render){
  if(slot._inFlight) return;
  _enviarFotoSlotTentativa(slot, kk, render, 0);
}
// Tenta o upload e, se falhar (rede instavel/offline), tenta de novo sozinho mais
// 2 vezes com espera crescente antes de pedir pro tecnico tocar em "tentar novamente".
// Isso evita que uma oscilacao rapida de sinal vire trabalho manual.
function _enviarFotoSlotTentativa(slot, kk, render, tentativa){
  slot._inFlight = true;
  slot.status='uploading'; render();
  var path = ST.uploadId+'/'+kk+'/'+Date.now()+'.jpg';
  uploadFoto(slot.localPreview, path).then(function(r){
    slot._inFlight = false;
    slot.status='done'; slot.url=r.url; slot.storagePath=r.storagePath;
    render(); salvarRascunho(); refreshSecaoHeader();
  }).catch(function(e){
    if(tentativa < 2){
      setTimeout(function(){ _enviarFotoSlotTentativa(slot, kk, render, tentativa+1); }, 1500*(tentativa+1));
    } else {
      slot._inFlight = false;
      slot.status='error'; render(); refreshSecaoHeader();
    }
  });
}
// Quando a internet volta (ou o app volta pro primeiro plano), reenvia sozinho
// qualquer foto que tenha ficado travada em erro — sem precisar que o tecnico
// ache e toque em cada botao "tentar novamente" manualmente.
function retomarUploadsPendentes(){
  if(!navigator.onLine) return;
  CAT.forEach(function(it){
    var kk=ky(it), cc=ST.chk[kk];
    (cc.fotos||[]).forEach(function(f){ if(f.status==='error') enviarFotoSlot(f, kk, function(){ renderFotos(kk); }); });
  });
  (ST.pecas||[]).forEach(function(pc,i){
    (pc.fotos||[]).forEach(function(f){ if(f.status==='error') enviarFotoSlot(f, 'pecas_'+i, function(){ renderFotosPeca(i); }); });
  });
}
function addFotoItem(kk,inp){
  if(!inp.files||!inp.files[0]) return;
  var cc=ST.chk[kk]; if(cc.fotos.length>=maxFotosPara(kk)) return;
  var file=inp.files[0]; inp.value='';
  compress(file,function(b64){
    var slot={status:'uploading',localPreview:b64,url:null,storagePath:null};
    cc.fotos.push(slot);
    enviarFotoSlot(slot, kk, function(){ renderFotos(kk); });
  });
}
function retryFotoItem(kk,idx){
  var slot=ST.chk[kk].fotos[idx]; if(!slot) return;
  enviarFotoSlot(slot, kk, function(){ renderFotos(kk); });
}
function delFotoItem(kk,idx){ ST.chk[kk].fotos.splice(idx,1); renderFotos(kk); refreshSecaoHeader(); salvarRascunho(); }

function rResumo(p){
  var mo=[],de=[],troca=[],rec=[],celula=[],pend=[];
  CAT.forEach(function(i){ var cc=ST.chk[ky(i)]; if(cc.st==='montado') mo.push(i); else if(cc.st==='desmontado'){ de.push(i); if(cc.flag==='troca') troca.push(i); else if(cc.flag==='recuperacao') rec.push(i); else if(cc.flag==='celula') celula.push(i); }else pend.push(i); });
  var flagCount = troca.length + rec.length + celula.length;
  var h='<div class="s4">'
    +'<div class="sbox"><div class="snum t">'+CAT.length+'</div><div class="slbl">Total</div></div>'
    +'<div class="sbox"><div class="snum mo">'+mo.length+'</div><div class="slbl">Não desm.</div></div>'
    +'<div class="sbox"><div class="snum de">'+de.length+'</div><div class="slbl">Desmontado</div></div>'
    +'<div class="sbox"><div class="snum re">'+flagCount+'</div><div class="slbl">Com flag</div></div>'
  +'</div>';
  if(pend.length>0) h+='<div class="wn">'+pend.length+' item(ns) sem avaliação.</div>';
  h+='<div class="ib"><div class="ir"><span class="ik">Placa</span><span class="iv pv">'+(ST.placa||'-').toUpperCase()+'</span></div><div class="ir"><span class="ik">Data</span><span class="iv">'+(ST.data?ST.data.split('-').reverse().join('/'):'-')+'</span></div><div class="ir"><span class="ik">Técnico</span><span class="iv">'+(ST.td||'-')+'</span></div></div>';
  var flagLabels = {troca:'<svg class="svg-i" aria-hidden="true"><use href="#i-refresh"/></svg> Troca',recuperacao:'<svg class="svg-i" aria-hidden="true"><use href="#i-undo"/></svg> Recuperação',celula:'<svg class="svg-i" aria-hidden="true"><use href="#i-grid"/></svg> Célula'};
  [['troca',troca],['recuperacao',rec],['celula',celula]].forEach(function(pair){
    var tipo=pair[0], lista=pair[1];
    if(!lista.length) return;
    h+='<div class="res-sec"><div class="res-sec-title">'+flagLabels[tipo]+' <span class="res-badge re">'+lista.length+'</span></div>';
    lista.forEach(function(it){ h+='<div class="res-item"><div class="res-dot re"></div><div><div class="res-sec2">'+it.s+' &middot; '+it.r+'</div><div class="res-desc">'+ac(it.d)+'</div></div></div>'; });
    h+='</div>';
  });
  if(de.length>0){ h+='<div class="res-sec"><div class="res-sec-title">Desmontadas <span class="res-badge de">'+de.length+'</span></div>'; de.forEach(function(it){ var cc=ST.chk[ky(it)]; h+='<div class="res-item"><div class="res-dot de"></div><div><div class="res-sec2">'+it.s+' &middot; '+it.r+'</div><div class="res-desc">'+ac(it.d)+'</div>'+(cc.o?'<div style="font-size:12px;color:var(--ink3);font-style:italic;margin-top:2px">'+cc.o+'</div>':'')+'<div style="font-size:11px;color:var(--ink3);margin-top:2px">'+cc.fotos.length+' foto(s)</div></div></div>'; }); h+='</div>'; }
  if(mo.length>0){ h+='<div class="res-sec"><div class="res-sec-title">Não desmontadas <span class="res-badge mo">'+mo.length+'</span></div>'; mo.forEach(function(it){ h+='<div class="res-item"><div class="res-dot mo"></div><div><div class="res-sec2">'+it.s+' &middot; '+it.r+'</div><div class="res-desc">'+ac(it.d)+'</div></div></div>'; }); h+='</div>'; }
  p.innerHTML=h;
}

// ── NAVEGACAO ────────────────────────────────────────────────────────────────
function goNext(){
  var s=STEPS[ST.step];
  if(s==='hdr'){ if(!ST.placa||!ST.data||!ST.td){ mostrarModal('Preencha a Placa, a Data e confirme o Técnico.','<svg class="svg-i" aria-hidden="true"><use href="#i-clipboard"/></svg>'); return; } }
  if(SECS.indexOf(s)>=0){
    var its=CAT.filter(function(i){ return i.s===s; });
    var pending=its.filter(function(i){ return !ST.chk[ky(i)].st; });
    function prosseguirSecao(){
      // Fotos ainda enviando ou com erro: nao deixa prosseguir (evita perder foto se a pagina travar)
      var naoProntas=its.filter(function(i){
        var cc=ST.chk[ky(i)];
        return (cc.fotos||[]).some(function(f){ return f.status==='uploading' || f.status==='error'; });
      });
      if(naoProntas.length>0){
        var temErro=naoProntas.some(function(i){ return ST.chk[ky(i)].fotos.some(function(f){ return f.status==='error'; }); });
        var firstNP=document.getElementById('cd-'+ky(naoProntas[0])); if(firstNP) firstNP.scrollIntoView({behavior:'smooth',block:'center'});
        mostrarModal(temErro ? 'Uma ou mais fotos falharam ao enviar. Toque em "tentar novamente" antes de continuar.' : 'Aguarde o envio das fotos terminar antes de continuar.', temErro?'<svg class="svg-i i-warn" aria-hidden="true"><use href="#i-alert"/></svg>':'<svg class="svg-i" aria-hidden="true"><use href="#i-clock"/></svg>');
        return;
      }
      // Em modo de edição as fotos minimas ja estao no banco — nao valida quantidade
      if(!ST._editId){
        var semFoto=its.filter(function(i){
          var cc=ST.chk[ky(i)];
          if(cc.st==='desmontado') return cc.fotos.length < MAX_FOTOS;
          if(i.destaque && cc.st==='montado') return cc.fotos.length < 1;
          return false;
        });
        if(semFoto.length>0){
          semFoto.forEach(function(it){ var fo=document.getElementById('fo-'+ky(it)); if(fo) fo.classList.add('show'); });
          var first=document.getElementById('cd-'+ky(semFoto[0])); if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
          mostrarModal('Registre as fotos obrigatórias antes de continuar. ('+semFoto.length+' pendente(s))','<svg class="svg-i" aria-hidden="true"><use href="#i-camera"/></svg>');
          return;
        }
      }
      ST.step++; render();
    }
    if(pending.length===its.length){
      mostrarConfirmacao('Nenhum item foi avaliado nesta seção.\nConfirma que nenhum foi desmontado?','<svg class="svg-i i-info" aria-hidden="true"><use href="#i-help"/></svg>',function(){
        its.forEach(function(it){ ST.chk[ky(it)].st='montado'; });
        prosseguirSecao();
      });
      return;
    }
    if(pending.length>0){
      mostrarConfirmacao(pending.length+' item(ns) ainda sem avaliacao.\nOs itens pendentes não foram desmontados?','<svg class="svg-i i-warn" aria-hidden="true"><use href="#i-alert"/></svg>',function(){
        pending.forEach(function(it){ ST.chk[ky(it)].st='montado'; });
        prosseguirSecao();
      });
      return;
    }
    prosseguirSecao();
    return;
  }
  if(s==='pecas'){
    var pecasNaoProntas = ST.pecas.some(function(p){ return (p.fotos||[]).some(function(f){ return f.status==='uploading' || f.status==='error'; }); });
    if(pecasNaoProntas){
      var temErroP = ST.pecas.some(function(p){ return (p.fotos||[]).some(function(f){ return f.status==='error'; }); });
      mostrarModal(temErroP ? 'Uma ou mais fotos de peças removidas falharam ao enviar. Toque em "tentar novamente" antes de continuar.' : 'Aguarde o envio das fotos de peças removidas terminar antes de continuar.', temErroP?'<svg class="svg-i i-warn" aria-hidden="true"><use href="#i-alert"/></svg>':'<svg class="svg-i" aria-hidden="true"><use href="#i-clock"/></svg>');
      return;
    }
  }
  if(s==='resumo'){
    perguntarComplemento(function(){
      if(ST._editId) salvarEdicao(); else enviar();
    });
    return;
  }
  ST.step++; render();
}
function goBack(){ if(ST.step===0){ ST.mode='home'; render(); return; } ST.step--; render(); }

// ── ENVIAR ───────────────────────────────────────────────────────────────────
var PECAS_LABELS = [
  'Caixas dentro do carro com pecas desmontadas (identificar com a placa e lacrar)',
  'Pecas removidas fora do carro (identificadas com etiqueta e armazenadas adequadamente)'
];

function loading(msg){ document.getElementById('ls').classList.add('on'); document.getElementById('lm').textContent=msg||'Salvando...'; }
function loadingOff(){ document.getElementById('ls').classList.remove('on'); }

// Verifica se sobrou alguma foto nao enviada (travada ou com erro) antes de finalizar.
// As fotos ja foram enviadas ao R2 no momento em que foram tiradas — aqui so falta
// gravar as referencias no banco, por isso o envio final fica rapido e confiavel.
function fotosPendentesGlobal(){
  var pend=false;
  CAT.forEach(function(it){ if((ST.chk[ky(it)].fotos||[]).some(function(f){ return f.status!=='done'; })) pend=true; });
  (ST.pecas||[]).forEach(function(p){ if((p.fotos||[]).some(function(f){ return f.status!=='done'; })) pend=true; });
  return pend;
}
function enviar(){
  (async function(){
    try {
      if(fotosPendentesGlobal()){
        mostrarModal('Ainda há fotos sendo enviadas ou com erro. Volte e aguarde/tente novamente antes de enviar.','<svg class="svg-i i-warn" aria-hidden="true"><use href="#i-alert"/></svg>');
        return;
      }
      loading('Buscando técnico...');

      var tecs = await sbSelect('tecnicos', 'select=id&nome=eq.'+encodeURIComponent(ST.td));
      if(!tecs||!tecs[0]) throw new Error('Técnico não encontrado: '+ST.td);
      var tecId = tecs[0].id;

      loading('Criando registro...');
      var cl = await sbInsert('checklists', {
        id: ST.uploadId,
        placa: ST.placa,
        data: ST.data,
        tecnico_id: tecId,
        tem_complemento: ST.complemento || false
      });

      // Inserir itens do checklist (fotos ja estao no R2 — so grava a referencia)
      for(var idx=0; idx<CAT.length; idx++){
        var it = CAT[idx];
        var cc = ST.chk[ky(it)];
        loading('Salvando itens... ('+(idx+1)+'/'+CAT.length+')');

        var item = await sbInsert('checklist_itens', {
          checklist_id: cl.id,
          zona: it.s,
          item: it.d,
          situacao: cc.st==='montado' ? 'ok' : cc.st==='desmontado' ? 'nao_ok' : null,
          desmontado: cc.st==='desmontado',
          recuperacao: cc.flag === 'recuperacao',
          tipo_flag: cc.flag || null,
          observacao: cc.o || null
        });

        for(var fi=0; fi<(cc.fotos||[]).length; fi++){
          var foto = cc.fotos[fi];
          await sbInsert('checklist_fotos', { item_id: item.id, storage_path: foto.storagePath, url: foto.url });
        }
      }

      // Inserir pecas removidas (fotos ja estao no R2 — so grava a referencia)
      for(var pi=0; pi<ST.pecas.length; pi++){
        var pec = ST.pecas[pi];
        loading('Salvando peça '+(pi+1)+'...');
        var pitem = await sbInsert('checklist_itens', {
          checklist_id: cl.id,
          zona: 'Pecas',
          item: PECAS_LABELS[pi],
          observacao: pec.o || null
        });

        for(var pfi=0; pfi<(pec.fotos||[]).length; pfi++){
          var pfoto = pec.fotos[pfi];
          await sbInsert('checklist_fotos', { item_id: pitem.id, storage_path: pfoto.storagePath, url: pfoto.url });
        }
      }

      loadingOff();
      sucesso(cl.id);

    } catch(e) {
      loadingOff();
      mostrarModal('Erro ao salvar: '+e.message, '<svg class="svg-i i-err" aria-hidden="true"><use href="#i-x-circle"/></svg>');
    }
  })();
}

function sucesso(id){
  setNav(false);
  limparRascunho();
  _ultimoChecklist = null; // reset — o próximo login verifica de novo
  document.getElementById('pg').innerHTML='<div class="sw"><div class="si"><svg class="svg-i i-ok" aria-hidden="true"><use href="#i-check-circle"/></svg></div><div class="st">Checklist enviado!</div><div class="ss">Dados salvos no banco e fotos no Supabase Storage.</div><div class="sid">ID: '+id+'</div><button class="snw" onclick="voltarHome()">Voltar ao início</button></div>';
  uiTop('CONCLUÍDO','','');
  verificarUltimoChecklist();
}

// ── EDITAR ULTIMO CHECKLIST ──────────────────────────────────────────────────
function iniciarEdicao(){
  if(!_ultimoChecklist) return;
  carregarParaEditar(_ultimoChecklist.id);
}

async function carregarParaEditar(clId){
  loading('Carregando checklist...');
  try {
    var cls = await sbSelect('checklists', 'select=*&id=eq.'+clId);
    var cl  = cls && cls[0];
    if(!cl){ loadingOff(); mostrarModal('Checklist não encontrado.','<svg class="svg-i i-err" aria-hidden="true"><use href="#i-x-circle"/></svg>'); return; }

    var itens = await sbSelect('checklist_itens',
      'select=id,zona,item,situacao,desmontado,recuperacao,tipo_flag,observacao&checklist_id=eq.'+clId+'&zona=neq.Pecas');

    loadingOff();

    ST._editId    = clId;
    ST.uploadId   = clId;
    ST.mode       = 'checklist';
    ST.step       = 0;
    ST.placa      = cl.placa;
    ST.data       = cl.data;
    ST.td         = _tecnico ? _tecnico.nome : cl.tecnico_id;
    ST.complemento= cl.tem_complemento || false;
    ST.pecas      = [{o:'',fotos:[]},{o:'',fotos:[]}];

    CAT.forEach(function(i){ ST.chk[ky(i)]={st:null,flag:null,o:'',fotos:[],dbId:null}; });

    (itens||[]).forEach(function(it){
      var cat = CAT.find(function(c){ return c.s===it.zona && c.d===it.item; });
      if(!cat) return;
      var kk = ky(cat);
      ST.chk[kk].st    = it.desmontado ? 'desmontado' : 'montado';
      ST.chk[kk].flag  = it.tipo_flag || (it.recuperacao ? 'recuperacao' : null);
      ST.chk[kk].o     = it.observacao || '';
      ST.chk[kk].dbId  = it.id;
    });

    render();
  } catch(e) {
    loadingOff();
    mostrarModal('Erro ao carregar: '+e.message,'<svg class="svg-i i-err" aria-hidden="true"><use href="#i-x-circle"/></svg>');
  }
}

async function salvarEdicao(){
  if(fotosPendentesGlobal()){
    mostrarModal('Ainda há fotos sendo enviadas ou com erro. Aguarde/tente novamente antes de salvar.','<svg class="svg-i i-warn" aria-hidden="true"><use href="#i-alert"/></svg>');
    return;
  }
  loading('Atualizando checklist...');
  try {
    // Atualiza o header do checklist
    await sbUpdate('checklists', ST._editId, {
      placa: ST.placa,
      data: ST.data,
      tem_complemento: ST.complemento || false,
      editado: true
    });

    // Atualiza cada item
    for(var idx=0; idx<CAT.length; idx++){
      var it = CAT[idx];
      var cc = ST.chk[ky(it)];
      if(!cc.dbId) continue;
      loading('Atualizando itens... ('+(idx+1)+'/'+CAT.length+')');
      await sbUpdate('checklist_itens', cc.dbId, {
        situacao: cc.st==='montado' ? 'ok' : cc.st==='desmontado' ? 'nao_ok' : null,
        desmontado: cc.st==='desmontado',
        recuperacao: cc.flag === 'recuperacao',
        tipo_flag: cc.flag || null,
        observacao: cc.o || null
      });
      // Novas fotos adicionadas na edicao ja foram enviadas ao R2 — so grava a referencia
      for(var fi=0; fi<(cc.fotos||[]).length; fi++){
        var foto = cc.fotos[fi];
        await sbInsert('checklist_fotos', { item_id: cc.dbId, storage_path: foto.storagePath, url: foto.url });
      }
    }

    _ultimoChecklist = null;
    loadingOff();
    var savedId = ST._editId;
    ST._editId = null;
    sucesso(savedId);
  } catch(e) {
    loadingOff();
    mostrarModal('Erro ao atualizar: '+e.message,'<svg class="svg-i i-err" aria-hidden="true"><use href="#i-x-circle"/></svg>');
  }
}

// Oculta app até autenticar
document.getElementById('sa').style.display = 'none';
document.getElementById('topbar-content').style.display = 'none';
document.getElementById('logout-area').style.display = 'none';
iniciarSessao();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').then(function(reg) {
    setInterval(function() { reg.update(); }, 10 * 60 * 1000);
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') reg.update();
    });
  });

  // Quando uma versão nova assume o controle, recarrega a página automaticamente
  var swAtualizando = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (swAtualizando) return;
    swAtualizando = true;
    location.reload();
  });
}

// Aviso de sem conexao, e reenvio automatico do que ficou pendente assim que
// a internet volta (ou o app volta pro primeiro plano com internet disponivel) —
// o tecnico nao precisa achar e tocar em cada "tentar novamente" manualmente.
function atualizarStatusConexao() {
  var bar = document.getElementById('offline-bar');
  if (!bar) return;
  if (navigator.onLine) bar.classList.remove('show'); else bar.classList.add('show');
}
window.addEventListener('online', function(){ atualizarStatusConexao(); retomarUploadsPendentes(); });
window.addEventListener('offline', atualizarStatusConexao);
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') retomarUploadsPendentes();
});
atualizarStatusConexao();
</script>
